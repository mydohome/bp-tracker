services:
  db:
    image: postgres:16-alpine
    container_name: payslip_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: payslip
      POSTGRES_PASSWORD: payslip
      POSTGRES_DB: payslip
    volumes:
      - payslip_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payslip -d payslip"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: payslip_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://payslip:payslip@db:5432/payslip
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: payslip_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  payslip_db_data:
