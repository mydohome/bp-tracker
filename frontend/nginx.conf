server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        client_max_body_size 20M;

        # L'estrazione via Claude API può richiedere tempo, soprattutto
        # con i retry automatici in caso di risposta troncata o errori
        # transitori (fino a ~3 tentativi). Il default nginx di 60s è
        # troppo corto e causa "Gateway Time-out" spurii.
        proxy_connect_timeout 180s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
